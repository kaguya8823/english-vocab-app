
services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/src/src

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./backend/src:/src/src
    environment:
      DATABASE_URL: mysql://root:root@mysql:3306/english_vocab
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0

    container_name: english_mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: english_vocab

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data: